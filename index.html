<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Tower Race</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>
    <div id="start-screen" class="overlay">
        <div class="start-card">
            <h1>MATH TOWER RACE</h1>
            <p>Jawab cepat, tumpuk menaramu sampai puncak 15 balok!</p>
            <button id="start-btn">PRESS START 🎮</button>
        </div>
    </div>

    <div id="win-modal" class="overlay hidden">
            <div class="start-card win-card" id="modal-card">
                <h1 id="win-title">🎉 LEVEL PASSED! 🎉</h1>
                <p id="win-subtitle">Komputer akan bergerak lebih cepat di level berikutnya!</p>
                <button id="next-level-btn">LANJUT LEVEL 2 ➔</button>
            </div>
        </div>

        <!-- Background Awan -->
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>

        <div class="game-container">
            <!-- Top Header & Audio Control -->
            <div class="top-header">
                <div class="level-badge" id="level-display">LEVEL 1/5</div>
                <div class="title-banner">SOLVE THE PROBLEM TO RISE!</div>
                <button id="music-btn">🎵 BGM: ON</button>
            </div>

            <!-- HUD Dashboard -->
            <div class="hud-bar">
                <div class="hud-card p1-card">
                    <h3>PLAYER 1</h3>
                    <p>SCORE: <span id="p1-score">0</span></p>
                    <p>TOWER HT: <span id="p1-ht">0</span>/15</p>
                    <p class="combo-text">COMBO: <span id="p1-combo">x1</span></p>
                </div>
